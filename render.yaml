services:
  # ── VidyaSetu ERP — Frontend (Static Site on Render) ──────────
  - type: web
    name: vidyasetu-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Pull the repo root → build inside frontend/
    rootDir: frontend

    # ── Environment Variables ────────────────────────────────────
    envVars:
      - key: VITE_API_URL
        value: https://vidya-setu--pankajyewale111.replit.app/api/v1
      - key: VITE_STORAGE_URL
        value: https://vidya-setu--pankajyewale111.replit.app/storage
      - key: VITE_APP_NAME
        value: VidyaSetu ERP
      - key: VITE_APP_VERSION
        value: "1.0.0"
      - key: VITE_DEFAULT_LANGUAGE
        value: mr
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyDa-hfmThLygBtQ138MFvc6OX9f54GwhMM
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: amc-ticketmanagement.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: amc-ticketmanagement
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: amc-ticketmanagement.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "769130712470"
      - key: VITE_FIREBASE_APP_ID
        value: "1:769130712470:web:3a3e9fa0783715c24161b7"
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: G-M8MNRYNMQ7
      - key: VITE_FIREBASE_VAPID_KEY
        value: BAeZThZ-vltN-CnkZANQ-3kGz6BQ72_esolcK_hL3oecIiuS8RHfgesjnHeY3fPp_ZUWhc1lxNqAL6pcKYHj_J0

    # ── SPA Routing (React Router) ───────────────────────────────
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
