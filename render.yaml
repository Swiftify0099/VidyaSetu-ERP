services:
  # ── VidyaSetu ERP — Backend (FastAPI Web Service on Render) ────
  - type: web
    name: vidyasetu-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true

    # ── Environment Variables ────────────────────────────────────
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: VidyaSetu ERP
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_VERSION
        value: "1.0.0"
      - key: FRONTEND_URL
        value: https://vidyasetu.pages.dev
      - key: ALLOWED_ORIGINS
        value: https://vidyasetu.pages.dev,http://localhost:5173,http://localhost:3000
      - key: UPLOAD_BASE_DIR
        value: ./storage
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: MAX_VIDEO_SIZE_MB
        value: "500"
      - key: DEFAULT_PAGE_SIZE
        value: "20"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DATE_FORMAT
        value: DD/MM/YYYY
      - key: DEFAULT_LANGUAGE
        value: mr
      # Sensitive secrets below must be configured in Render Dashboard:
      # - DATABASE_URL (e.g., postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require)
      # - JWT_SECRET_KEY
      # - APP_SECRET_KEY
      # - OPENROUTER_API_KEY

  # ── VidyaSetu ERP — Frontend (Static Site on Render) ──────────
  - type: web
    name: vidyasetu-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend

    envVars:
      - key: VITE_API_URL
        value: https://vidyasetu-backend.onrender.com/api/v1
      - key: VITE_STORAGE_URL
        value: https://vidyasetu-backend.onrender.com/storage
      - key: VITE_APP_NAME
        value: VidyaSetu ERP
      - key: VITE_APP_VERSION
        value: "1.0.0"
      - key: VITE_DEFAULT_LANGUAGE
        value: mr

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
