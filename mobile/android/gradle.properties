# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true

# ── Java ─────────────────────────────────────────────────────────────────────
# Force Gradle to use JDK 17 (Temurin) regardless of system JAVA_HOME
# RN 0.73.4 + AGP 8.3.2 requires JDK 17; JDK 22 (currently in system PATH)
# causes incompatibilities and JVM OOM crashes during native compilation.
org.gradle.java.home=C:\\Users\\panka\\.gradle\\jdks\\eclipse_adoptium-17-amd64-windows.2

# ── Memory: tuned for 7GB RAM system ────────────────────────────────────────
# With JDK 17, -Xmx1536m is safe for single-worker builds on 7GB RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin daemon memory (keep low)
kotlin.daemon.jvmargs=-Xmx512m

# ── Gradle Performance ────────────────────────────────────────────────────────
# 1 parallel worker to avoid OOM on 7GB RAM machine
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.caching=true
android.experimental.cxx.jobs=2

# ── React Native ──────────────────────────────────────────────────────────────
REACT_NATIVE_NODE_MODULES_DIR=../node_modules
reactNativeArchitectures=arm64-v8a
newArchEnabled=false
hermesEnabled=true

# ── Release Signing ───────────────────────────────────────────────────────────
MYAPP_RELEASE_STORE_FILE=my-upload-key.keystore
MYAPP_RELEASE_KEY_ALIAS=vidyasetu-key-alias
MYAPP_RELEASE_STORE_PASSWORD=vidyasetu123
MYAPP_RELEASE_KEY_PASSWORD=vidyasetu123

