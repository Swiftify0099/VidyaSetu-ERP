# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true

# ── Memory: reduced to prevent JVM OOM crash on 7GB RAM system ────────────────
# Was: -Xmx2048m which crashed the 64-bit JVM due to insufficient RAM+swap
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin daemon memory (keep low)
kotlin.daemon.jvmargs=-Xmx512m

# ── Gradle Performance ────────────────────────────────────────────────────────
# Run only 1 parallel build worker to save RAM (was using too much concurrently)
org.gradle.workers.max=2
org.gradle.daemon=true
org.gradle.caching=true
android.experimental.cxx.jobs=2

# ── React Native ──────────────────────────────────────────────────────────────
REACT_NATIVE_NODE_MODULES_DIR=../node_modules
reactNativeArchitectures=arm64-v8a
newArchEnabled=false
hermesEnabled=true
