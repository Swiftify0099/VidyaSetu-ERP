apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

project.ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native")

react {
    /* Folders */
    // root = "../../"
    // reactNativeDir = "../../node_modules/react-native"
    // codegenDir = "../../node_modules/@react-native/codegen"
    // cliPath = "node_modules/react-native/cli.js"
}

/**
 * Set this to true to create two separate APKs instead of one:
 * - An APK that only works on ARM devices
 * - An APK that only works on x86 devices
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * Set this to true to Enable Proguard to shrink the APK size in release builds.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred ABI to split.
 */
def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "arm64-v8a", "x86_64"]
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.vidyasetumobile"
    defaultConfig {
        applicationId "com.vidyasetumobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        missingDimensionStrategy 'react-native-camera', 'general'
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false
            include (*reactNativeArchitectures())
        }
    }

    signingConfigs {
        debug {
            // Use the standard Android debug keystore (auto-generated by Android tools)
            def userHome = System.getenv("USERPROFILE") ?: System.getProperty("user.home")
            storeFile file("${userHome}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

