services:

  # ── PostgreSQL Database ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: vidyasetu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vidyasetu}
      POSTGRES_USER: ${POSTGRES_USER:-vidyasetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidyasetu_pass_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidyasetu_user} -d ${POSTGRES_DB:-vidyasetu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidyasetu_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vidyasetu_user}:${POSTGRES_PASSWORD:-vidyasetu_pass_2024}@db:5432/${POSTGRES_DB:-vidyasetu}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      SCHOOL_NAME: ${SCHOOL_NAME:-Hindkesri Maruti Mane Vidyalay}
      CURRENT_ACADEMIC_YEAR: ${CURRENT_ACADEMIC_YEAR:-2025-2026}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python -m alembic upgrade head &&
        python -m app.modules.seeds.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── React Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidyasetu_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
