# ── VidyaSetu ERP — Nginx Reverse Proxy Config ───────────────
# Place this at: /etc/nginx/sites-available/vidyasetu
# Symlink: sudo ln -s /etc/nginx/sites-available/vidyasetu /etc/nginx/sites-enabled/

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name your-school.vidyasetu.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-school.vidyasetu.in;

    # ── SSL Certificates (Let's Encrypt) ─────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-school.vidyasetu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-school.vidyasetu.in/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;

    client_max_body_size 50M;

    # ── Backend API → FastAPI (port 8000) ────────────────────
    location /api/ {
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;

        # CORS — handled by FastAPI, don't duplicate here
    }

    # ── Static file uploads/storage ──────────────────────────
    location /storage/ {
        alias       /opt/vidyasetu/backend/storage/;
        expires     7d;
        add_header  Cache-Control "public, immutable";
        add_header  Access-Control-Allow-Origin "*";
    }

    # ── React Frontend SPA ────────────────────────────────────
    location / {
        root        /opt/vidyasetu/frontend/dist;
        try_files   $uri $uri/ /index.html;
        expires     1d;
        add_header  Cache-Control "public, must-revalidate";
    }

    # ── Cache static assets aggressively ─────────────────────
    location ~* \.(js|css|woff2|woff|ttf|ico|svg|png|jpg|webp)$ {
        root    /opt/vidyasetu/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/vidyasetu_access.log;
    error_log  /var/log/nginx/vidyasetu_error.log warn;
}
