name: VidyaSetu ERP — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# ── Environment Variables ─────────────────────────────────────
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/vidyasetu-backend
  FRONTEND_IMAGE: ${{ github.repository }}/vidyasetu-frontend

jobs:

  # ═══════════════════════════════════════════════════════════════
  # JOB 1: Backend Tests
  # ═══════════════════════════════════════════════════════════════
  backend-test:
    name: 🐍 Backend — Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vidyasetu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Create test .env
        working-directory: ./backend
        run: |
          cat > .env << EOF
          DATABASE_URL=postgresql://postgres:test_password@localhost:5432/vidyasetu_test
          SECRET_KEY=test-secret-key-for-ci-only
          APP_ENV=testing
          APP_DEBUG=false
          SCHOOL_NAME=Test School
          CURRENT_ACADEMIC_YEAR=2025-2026
          UPLOAD_BASE_DIR=./storage
          EOF

      - name: Run Alembic migrations (test DB)
        working-directory: ./backend
        run: alembic upgrade head

      - name: Run pytest
        working-directory: ./backend
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short \
            -x
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/vidyasetu_test
          SECRET_KEY: test-secret-key-for-ci-only
          APP_ENV: testing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: Frontend Build & Type Check
  # ═══════════════════════════════════════════════════════════════
  frontend-build:
    name: ⚛️ Frontend — TypeScript + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check (zero errors required)
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000/api/v1' }}
          VITE_APP_NAME: VidyaSetu ERP
          VITE_STORAGE_URL: ${{ secrets.VITE_STORAGE_URL || 'http://localhost:8000/storage' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: Docker Build & Push (only on main branch)
  # ═══════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for backend image
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build frontend Docker image (nginx)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════
  # JOB 4: Deploy to Production (after successful Docker build)
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://your-school.vidyasetu.in

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying VidyaSetu ERP..."
            cd /opt/vidyasetu

            # Pull latest images
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.BACKEND_IMAGE }}:latest
            docker pull ghcr.io/${{ env.FRONTEND_IMAGE }}:latest

            # Zero-downtime restart with docker compose
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend

            # Run DB migrations
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

            # Health check
            sleep 10
            curl -f http://localhost:8000/api/v1/health || (echo "Health check failed!" && exit 1)

            # Reload nginx
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Deployment successful!"

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ VidyaSetu ERP deployed to production!\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ VidyaSetu ERP deployment FAILED!\nCommit: ${{ github.sha }}\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
